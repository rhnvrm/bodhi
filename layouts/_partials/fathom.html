{{- $server := .Site.Params.fathomAnalytics.serverURL | default "cdn.usefathom.com" -}}
{{- if not (findRE `^https?://` $server) -}}
  {{- $server = printf "https://%s" (strings.TrimPrefix "//" $server) -}}
{{- end -}}
{{- $tracker := printf "%s/tracker.js" (strings.TrimSuffix "/" $server) -}}
<script>
(function(f, a, t, h, o, m){
	a[h]=a[h]||function(){
		(a[h].q=a[h].q||[]).push(arguments)
	};
	o=f.createElement('script'),
	m=f.getElementsByTagName('script')[0];
	o.async=1; o.src=t; o.id='fathom-script';
	m.parentNode.insertBefore(o,m)
})(document, window, {{ $tracker }}, 'fathom');
fathom('set', 'siteId', '{{ .Site.Params.fathomAnalytics.siteID }}');
fathom('trackPageview');
</script>
