<div id="header">
    {{ with $avatar := .Site.Params.Avatar }}
        {{ if not (hasPrefix $avatar ("" | relURL)) }}
            {{ $avatar = $avatar | replaceRE "^/([^/]|$)" "$1" | relURL }}
        {{ end }}
        <div class="avatar">
			<a href="{{ $.Site.BaseURL }}">
				<img src="{{ $avatar }}" alt="{{ $.Site.Title }}" />
			</a>
        </div>
    {{ end }}
	<a id="headerLink" href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a>
    {{- if isset .Site.Params "subtitle" -}}
	<span class="hidden"> - </span>
	<span id="headerSubtitle">{{ .Site.Params.Subtitle | markdownify }}</span>
    {{- end -}}
</div>
