{{ define "main" }}
		<article>
			<h1>{{ .Title }}</h1> 
			<div>
				{{ .Content }}
			</div>
			{{ with .Params.tags }}
			<div>
				<ul id="tags">
					{{ range . }}
					<li><a href="{{ "/tags/" | relLangURL }}{{ . | urlize }}">{{ . }}</a></li>
					{{ end }}
				</ul>
			</div>
			{{ end }}
			{{ template "_internal/disqus.html" . }}
			{{ with .Site.Params.CommentoSrc }}
			<div>
				{{ partial "commento.html" . }}
			</div>
			{{ end }}
		</article>
{{ end }}
