{{ define "main" }}
		<article>
			<h1>{{ .Title }}</h1> 
			<div>
				{{ .Content }}
			</div>
			{{ with .GetTerms "tags" }}
			<div>
				<ul id="tags">
					{{ range . }}
					<li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
					{{ end }}
				</ul>
			</div>
			{{ end }}
			{{ partial "disqus.html" . }}
			{{ with .Site.Params.CommentoSrc }}
			<div>
				{{ partial "commento.html" . }}
			</div>
			{{ end }}
		</article>
{{ end }}
