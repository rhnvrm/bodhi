<div class="light">
	<span>{{ dateFormat "02 Jan 2006" $.Date }}</span> -
	<span>{{ .ReadingTime }} minute read</span>
</div>
<div class="small light">
	{{ with .GetTerms "categories" }}
	categories: 
	{{ range . }}
	<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
	{{ end }}
	{{ end }}
	{{ with .GetTerms "tags" }}
	tags: 
	{{ range . }}
	<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
	{{ end }}
	{{ end }}
</div>
